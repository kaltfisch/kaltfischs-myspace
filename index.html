<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio autoplay loop>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <div id="left">
        <div id="updates">
            <img id="updates-bg" src="images/index-updates.png">
            <div id="update-msg-container">
                <p class="update-msg">05/17/2026 - complete homepage layout</p>
                <p class="update-msg"></p>
                <p class="update-msg"></p>
            </div>
        </div>
        <div id="links">
            <img class="link" id="github" src="images/index-link-github.png">
            <img class="link" id="youtube" src="images/index-link-youtube.png">
            <img class="link" id="letterboxd" src="images/index-link-letterboxd.png">
        </div>
    </div>
    <div id="menu">
        <img id="menu-bg" src="images/index-menu.png">
        <div id="main-bt-container">
            <img class="main-bt" id="archive" src="images/index-menu-button1.png">
            <img class="main-bt" id="gallery" src="images/index-menu-button2.png">
            <img class="main-bt" id="projects" src="images/index-menu-button3.png">
        </div>
    </div>
    <div id="right">
        <div id="sushi">
            <img class="side-bt" id="aboutme" src="images/index-sushi-aboutme.png">
            <img class="side-bt" id="contacts" src="images/index-sushi-contacts.png">
            <img class="side-bt" id="surpriseme" src="images/index-sushi-surpriseme.png">
        </div>
        <img id="guestbook" src="images/index-guestbook.png">
    </div>
    <script src="script.js"></script>
</body>
</html>
